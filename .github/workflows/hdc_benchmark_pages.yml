name: HDC-CSR Benchmarks & GitHub Pages WASM

on:
  push:
    branches:
      - feature/hdc-csr-experimental
      - main
    paths:
      - 'experiments/hdc-csr/**'
      - '.github/workflows/hdc_benchmark_pages.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go from go.mod
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          check-latest: true

      - name: Capture Environment Info
        id: envinfo
        run: |
          echo "GO_VERSION=$(go version)" >> $GITHUB_ENV
          CPU_NAME=$(lscpu | grep 'Model name' | head -n1 | cut -d: -f2 | xargs || echo "Runner CPU")
          echo "CPU_MODEL=$CPU_NAME" >> $GITHUB_ENV

      - name: Run Single-Core HDC Tests & Scientific Quality Evaluation
        run: |
          cd experiments/hdc-csr
          go test -v -cpu 1

      - name: Run Official Single-Core Benchmarks
        run: |
          cd experiments/hdc-csr
          go test -bench=Benchmark -benchmem -cpu 1 -benchtime=2s | tee bench_output.txt

      - name: Generate Automated CI Benchmarks & Quality JSON
        run: |
          go run experiments/hdc-csr/parse_bench.go experiments/hdc-csr/bench_output.txt experiments/hdc-csr/quality_output.json

      - name: Build WebAssembly Module
        run: |
          mkdir -p experiments/hdc-csr/web
          cp "$(go env GOROOT)/lib/wasm/wasm_exec.js" experiments/hdc-csr/web/wasm_exec.js || cp "$(go env GOROOT)/misc/wasm/wasm_exec.js" experiments/hdc-csr/web/wasm_exec.js
          GOOS=js GOARCH=wasm go build -o experiments/hdc-csr/web/mbvm_hdc.wasm ./experiments/hdc-csr/wasm

      - name: Deploy to GitHub Pages (gh-pages branch)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./experiments/hdc-csr/web
          keep_files: false
